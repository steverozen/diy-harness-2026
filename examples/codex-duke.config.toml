# Example: point the OpenAI Codex CLI at the Duke AI Proxy (LiteLLM),
# the same OpenAI-compatible endpoint used by duke-diy-harness.py.
#
# Codex keeps per-profile config in its own file. Install this as:
#     ~/.codex/duke.config.toml
# then run:
#     codex --profile duke
#     codex --profile duke -m gpt-5.3-codex   # override the model
#
# The API key is NOT stored here. Codex reads it from the environment
# variable named by env_key, so export it in your shell profile:
#     export DUKE_LITELLM_API_KEY=...      # never commit the actual key

model_provider = "duke"
model = "glm-5.2"
model_reasoning_effort = "medium"

# Optional: make the /model picker show Duke models instead of the
# built-in OpenAI catalog. model_catalog_json REPLACES the entire model
# list for this profile. The schema is strict, with many required fields
# beyond slug/display_name/description, so the practical recipe is to
# copy an entry from Codex's own cached catalog (~/.codex/models_cache.json),
# then edit slug, display_name, description, and priority for each Duke
# model you want listed.
#
#     model_catalog_json = "/home/YOU/.codex/model-catalogs/duke.json"
#
# The catalog file looks like: {"models": [ { "slug": "glm-5.2", ... }, ... ]}

[model_providers.duke]
name = "Duke AI Proxy"
base_url = "https://aiproxy.duhs.duke.edu/v1"
env_key = "DUKE_LITELLM_API_KEY"
# The Duke proxy serves gpt-5.3-codex in Responses-API mode.
# Recent Codex versions no longer support wire_api = "chat".
wire_api = "responses"
